services:
  dashboard:
    build: .
    ports:
      - "3000:8080"
    volumes:
      - dashboard-data:/app/data
      - ./server/data:/legacy-data:ro
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - LEGACY_DATA_DIR=/legacy-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dashboard-data:
    name: docker-dashboard-data
